version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: notion_widget_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NOTION_TOKEN=${NOTION_TOKEN}
      - ROCA_DEMO_DB_ID=${ROCA_DEMO_DB_ID}

  frontend:
    build:
      context: ./frontend
    container_name: notion_widget_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
